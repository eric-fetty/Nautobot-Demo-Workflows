---
version: 1
key: custom-filter-demo
name: Custom Filter Demo
description: >
  Demonstrates repo-backed Jinja filters that import shared helpers from
  scripts/lib. Non-destructive; does not change inventory.
category: Examples
enabled: true
manual_duration_minutes: 5
inputs:
  - key: hostname
    label: Hostname
    type: string
    required: true
actions:
  - type: nautobot
    name: Prepare Hostname
    script: scripts/echo_hostname.py
    when: "{{ (inputs.hostname | normalize_for_dns) != '' }}"
    with:
      hostname: "{{ inputs.hostname | normalize_for_dns }}"
